version: "3.8"
services:
  db:
    image: postgres:16-alpine
    container_name: muhanad-portfolio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: muhanad
      POSTGRES_PASSWORD: muhanad_secret
      POSTGRES_DB: muhanad_portfolio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
